name: Trigger Google Calendar Instant Sync

on:
  push:
    branches:
      - main
    paths:
      - 'calendars/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub Pages to deploy updated ICS files
        run: sleep 25

      - name: Call Google Apps Script Webhook
        run: |
          echo "Triggering instant Google Calendar sync..."
          if [ -z "${{ secrets.GAS_SYNC_WEBHOOK_URL }}" ]; then
            echo "GAS_SYNC_WEBHOOK_URL secret not configured. Skipping webhook trigger."
            exit 0
          fi
          RESPONSE=$(curl -L -s -w "\nHTTP_STATUS:%{http_code}" "${{ secrets.GAS_SYNC_WEBHOOK_URL }}")
          echo "Response: $RESPONSE"
