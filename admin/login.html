<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | Gia Tộc Trần Trọng Thu Admin</title>
    <link rel="icon" type="image/svg+xml" href="/assets/images/logoGiaToc_favicon.svg">
    <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
    <div class="login-page">
        <form class="login-card" id="login-form">
            <h1>Trần Trọng Thu</h1>
            <div class="subtitle">CONTROL ROOM — Đăng nhập</div>
            <div class="form-group">
                <label class="form-label">Tên đăng nhập</label>
                <input type="text" class="form-control" id="login-username" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label class="form-label">Mật khẩu</label>
                <input type="password" class="form-control" id="login-password" autocomplete="current-password" required>
            </div>
            <div id="login-error" class="login-error hidden"></div>
            <button type="submit" class="btn btn-primary" id="login-submit" style="width:100%;">Đăng nhập</button>
        </form>
    </div>
    <script type="module" src="/admin/js/login.js"></script>
</body>
</html>
