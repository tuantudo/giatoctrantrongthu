<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gia Tộc Trần Trọng Thu | Admin Control Room</title>
    <link rel="icon" type="image/svg+xml" href="/assets/images/logoGiaToc_favicon.svg">
    <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
    <div id="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Trần Trọng Thu</h2>
                <div class="subtitle">CONTROL ROOM</div>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <a href="#/" class="nav-item">Dashboard</a>
                </div>
                <div class="nav-section">
                    <div class="section-title">HỘP THƯ</div>
                    <a href="#/inbox" class="nav-item">Đề xuất <span class="badge" id="badge-inbox">0</span></a>
                </div>
                <div class="nav-section">
                    <div class="section-title">KHO TRI THỨC</div>
                    <a href="#/people" class="nav-item">Nhân sự (People)</a>
                    <a href="#/stories" class="nav-item">Mạch (Stories)</a>
                    <a href="/me/gallery" class="nav-item">Kho Di Ảnh ↗</a>
                    <a href="#/events" class="nav-item">Sự kiện (Events)</a>
                </div>
                <div class="nav-section hidden" id="nav-section-admin">
                    <div class="section-title">QUẢN TRỊ</div>
                    <a href="#/members" class="nav-item">Tài khoản Thành viên</a>
                    <a href="#/users" class="nav-item">Người dùng Admin</a>
                    <a href="#/database" class="nav-item">Database</a>
                </div>
            </nav>
            <div class="sidebar-footer">
                <a href="/me" style="display:block;font-size:12px;margin-bottom:6px;color:#94a3b8;text-decoration:none;">← Không gian Thành viên (/me)</a>
                <a href="/" style="display:block;font-size:12px;margin-bottom:10px;color:#94a3b8;text-decoration:none;">← Trang công khai (/)</a>
                <div class="user-info-block">
                    <div class="user-info" id="user-info">Đang tải...</div>
                    <button class="btn-logout" id="btn-logout">Đăng xuất</button>
                </div>
            </div>
        </aside>
        
        <!-- Main Content -->
        <main class="main-content" id="main-view">
            <!-- Content injected by JS routing -->
        </main>
    </div>

    <!-- Typeahead Overlay (Global) -->
    <div id="typeahead-overlay" class="typeahead-overlay hidden">
        <div class="typeahead-backdrop" id="typeahead-backdrop"></div>
        <div class="typeahead-container">
            <div class="typeahead-header">
                <h3 id="typeahead-title">Chọn đối tượng</h3>
            </div>
            <input type="text" id="typeahead-input" placeholder="Tìm tên nhân vật...">
            <ul id="typeahead-results" class="typeahead-results"></ul>
        </div>
    </div>
    
    <!-- Public Preview Modal -->
    <div id="preview-modal" class="modal-overlay hidden">
        <div class="modal-window">
            <div class="modal-header">
                <h3>Public Preview</h3>
                <button class="btn-close" id="btn-close-modal">Đóng</button>
            </div>
            <div class="modal-body" id="preview-content"></div>
        </div>
    </div>

    <script type="module" src="/admin/js/admin.js"></script>
</body>
</html>
